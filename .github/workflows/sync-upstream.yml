name: sync upstream

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history needed for rebase

      - name: add upstream and fetch
        run: |
          git remote add upstream https://github.com/mastodon/documentation.git
          git fetch upstream main

      - name: set git identity
        run: |
          git config user.name "TAKAHASHI Shuuji"
          git config user.email "id@shuuji3.xyz"

      - name: rebase fork main onto upstream/main
        run: git rebase upstream/main

      - name: push
        run: git push --force-with-lease origin main
